name: Dev prerelease

on:
  push:
    tags: ['dev-v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=2

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android platform and signing tools
        run: |
          sdk_manager="$(command -v sdkmanager || true)"
          "${sdk_manager:-$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager}" \
            'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get
      - name: Load the preview signing key
        env:
          DEV_ANDROID_SIGNING: ${{ secrets.DEV_ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          key = json.loads(os.environ['DEV_ANDROID_SIGNING'])
          password = key['password']
          print(f'::add-mask::{password}')
          keystore = Path(os.environ['RUNNER_TEMP']) / 'yibubang-preview.p12'
          keystore.write_bytes(base64.b64decode(key['keystore'], validate=True))
          keystore.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'KEYSTORE_PATH={keystore}\n')
              env.write(f'KEYSTORE_PASSWORD={password}\n')
              env.write('KEY_ALIAS=yibubang-preview\n')
              env.write(f'KEY_PASSWORD={password}\n')
          PY
      - name: Build and verify the Android preview APK
        env:
          YIBUBANG_ANDROID_PREVIEW: 'true'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk" > preview-signer.txt
          grep -F 'certificate DN: CN=Yibubang Preview' preview-signer.txt
          "$tools/aapt" dump badging "$apk" > preview-package.txt
          grep -F "package: name='com.melonhu.yibubang.preview'" preview-package.txt
          grep -F "application-label:'医不帮试用版'" preview-package.txt
          cp "$apk" "yibubang-$RELEASE_TAG-android-preview.apk"
      - name: Remove the preview signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yibubang-preview.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-android-preview
          path: yibubang-*-android-preview.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: flutter build windows --release "--dart-define=YIBUBANG_WINDOWS_RELEASE_TAG=$env:RELEASE_TAG"
      - name: Verify and archive the Windows bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          $required = @(
            'yibubang.exe',
            'flutter_windows.dll',
            'data/icudtl.dat',
            'data/app.so',
            'data/fonts/NotoSansSC-Regular.ttf'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf)) {
              throw "Missing Windows bundle file: $file"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "yibubang-$env:RELEASE_TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-windows-x64
          path: yibubang-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [verify, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          - Windows x64：完整解压 ZIP 后运行 `yibubang.exe`。
          - Android：安装「医不帮试用版」APK，可与正式版并存。试用版首次安装可通过题库与记录导入或医不帮多端同步带入数据。

          ### 本版改动

          - 首页 1–5 切换五个板块。每日计划支持键盘答题、翻卡和认知状态评分，评分键可自定义。
          - 医考帮登录失效弹窗可选「不再提示」，也可在设置中重新开启。
          - 设置新增同步调试日志，支持查看和复制本机历史。
          - 期末题库的智能增量同步可限定到系统解剖学等科目，手动与自动同步共用范围。
          EOF
          gh release create "$RELEASE_TAG" \
            "yibubang-$RELEASE_TAG-windows-x64.zip" "yibubang-$RELEASE_TAG-android-preview.apk" \
            --verify-tag --prerelease --latest=false \
            --title "医不帮 $RELEASE_TAG · 试用版" --notes-file release_notes.md
