name: Dev Windows prerelease

on:
  push:
    tags: ['dev-v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=2

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Verify and archive the Windows bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          $required = @(
            'yibubang.exe',
            'flutter_windows.dll',
            'data/icudtl.dat',
            'data/app.so',
            'data/fonts/NotoSansSC-Regular.ttf'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf)) {
              throw "Missing Windows bundle file: $file"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "yibubang-$env:RELEASE_TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-windows-x64
          path: yibubang-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [verify, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dev-windows-x64
      - name: Publish Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          Windows x64 试用版。完整解压 ZIP 后运行 `yibubang.exe`。

          - 解剖题目页图打不开时，可回退到本机教材 PDF。
          - 支持自定义快捷键、字体和阅读排版。
          - 答案、统计和题源共用阅读宽度。
          EOF
          gh release create "$RELEASE_TAG" "yibubang-$RELEASE_TAG-windows-x64.zip" \
            --verify-tag --prerelease --latest=false \
            --title "医不帮 $RELEASE_TAG · Windows 试用版" --notes-file release_notes.md
